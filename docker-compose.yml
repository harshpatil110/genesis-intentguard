version: '3.8'

services:
  redis-quarantine:
    image: redis:alpine
    container_name: intentguard-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  intentguard-backend:
    build:
      context: ./intentguard/backend
      dockerfile: Dockerfile
    container_name: intentguard-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis-quarantine:6379/0
      - BLOCKCHAIN_API_BASE_URL=http://host.docker.internal:8200
      - BLOCKCHAIN_USE_MOCK=false
      - Q_LLM_BASE_URL=http://host.docker.internal:11434/v1
      - OPENCLAW_GATEWAY_WS_URL=ws://openclaw-sandbox:18789
    depends_on:
      redis-quarantine:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  intentguard-frontend:
    build:
      context: ./intentguard/frontend
      dockerfile: Dockerfile
    container_name: intentguard-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/xray-stream
      - NEXT_PUBLIC_FABRIC_API_URL=http://192.168.21.160:8000
    depends_on:
      - intentguard-backend

  openclaw-sandbox:
    build:
      context: ./openclaw
      dockerfile: Dockerfile.sandbox
    container_name: openclaw-sandbox
    ports:
      - "18789:18789"
    environment:
      - INTENTGUARD_GATEWAY_URL=http://intentguard-backend:8000
